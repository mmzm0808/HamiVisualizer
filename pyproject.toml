[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hamivisualizer"
version = "0.4.0"
description = "Interactive scalar Hermitian lattice Hamiltonian visualizer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "sympy>=1.14,<2",
  "PySide6>=6.6,<6.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hamivisualizer = "hamivisualizer.main:main"

[tool.setuptools.packages.find]
include = ["hamivisualizer*"]

[tool.pytest.ini_options]
testpaths = ["hamivisualizer/tests"]
# Keep pytest's cache alongside the project's reproducible test artifacts;
# this avoids creating a second hidden cache at the repository root on
# Windows, where stale locks can also make the final warning look like a
# product failure.
cache_dir = ".codex-artifacts/test-runs/pytest-cache"
# Keep pytest's tmp_path fixtures inside the project artifact area.  This
# prevents routine tests from creating folders under the user's system Temp.
addopts = "-ra --basetemp=.codex-artifacts/test-runs/pytest-default"
